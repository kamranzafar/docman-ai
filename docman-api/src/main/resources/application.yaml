server:
  port: 8081
minio:
  address: http://localhost:9000
  user: minioadmin
  password: minioadmin
  bucket: docman
  presigned:
    upload-url-expiry: 3600
    download-url-expiry: 300
kafka:
  address: localhost:9092
  groupId: docman
  topic: documents
  metadata-sync-topic: document-metadata-sync
  message-retention: 86400000
spring:
  main:
    allow-bean-definition-overriding: true
    jackson:
      serialization:
        INDENT_OUTPUT: true
  data:
    mongodb:
      host: localhost
      port: 27017
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  temporal:
    connection:
      target: localhost:7233
    workers-auto-discovery:
      packages:
        - "org.kamranzafar.docman.wf"
  ssl:
    bundle:
      pem:
        opensearch:
          truststore:
            certificate: classpath:opensearch-root-ca.pem
  ai:
    vectorstore:
      opensearch:
        uris: https://localhost:9200
        username: admin
        password: SecureP@ssword1
        initialize-schema: true
        index-name: docman-vector-index
        dimensions: 768
        similarity: cosinesimil
        ssl-bundle: opensearch
    ollama:
      base-url: http://localhost:11434/
      embedding:
        options:
          model: nomic-embed-text
      chat:
        model: llama3.1
        options:
          timeout: 600s
          temperature: 1