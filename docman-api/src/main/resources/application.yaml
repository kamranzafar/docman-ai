server:
  port: 8081
minio:
  address: http://localhost:9000
  user: minioadmin
  password: minioadmin
  bucket: docman
  presigned:
    upload-url-expiry: 3600
    download-url-expiry: 300
kafka:
  address: localhost:9092
  groupId: docman
  topic: documents
  metadata-sync-topic: document-metadata-sync
  message-retention: 86400000
docman:
  # Per-client-IP token-bucket rate limit applied to the cost-bearing endpoints
  # (/api/v1/document/ask, /search, /search/hybrid, and /mcp) - OWASP LLM10.
  ratelimit:
    enabled: true
    capacity: 20
    refill-tokens: 20
    refill-period: 1m
spring:
  main:
    allow-bean-definition-overriding: true
    jackson:
      serialization:
        INDENT_OUTPUT: true
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      host: localhost
      port: 27017
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  temporal:
    connection:
      target: localhost:7233
    workers-auto-discovery:
      packages:
        - "org.kamranzafar.docman.wf"
  ssl:
    bundle:
      pem:
        opensearch:
          truststore:
            certificate: classpath:opensearch-root-ca.pem
  ai:
    # Selects which model provider's autoconfiguration activates. Both Ollama and
    # OpenAI starters are always on the classpath (see docman-api/pom.xml) so that
    # switching provider is a config-only change (e.g. the "prod" profile flips
    # these to "openai") rather than a code or dependency change.
    model:
      chat: ollama
      embedding: ollama
      # This app never uses audio/image/moderation models, but the OpenAI starter's
      # autoconfigurations for them default to enabled (matchIfMissing=true) when
      # unset, unlike chat/embedding above - so without this they'd try to build
      # OpenAI beans (and fail on the missing api-key) even under this Ollama
      # profile just because the OpenAI starter is on the classpath.
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none
    vectorstore:
      opensearch:
        uris: https://localhost:9200
        username: admin
        password: SecureP@ssword1
        initialize-schema: true
        index-name: docman-vector-index
        dimensions: 768
        similarity: cosinesimil
        ssl-bundle: opensearch
    ollama:
      base-url: http://localhost:11434/
      embedding:
        options:
          model: nomic-embed-text
      chat:
        model: llama3.1
        options:
          timeout: 600s
          temperature: 1
    mcp:
      server:
        name: docman-mcp-server
        version: 1.0.0
        # Streamable HTTP transport, served on the same port as the REST API (8081) at
        # the default /mcp endpoint - no separate process/port for MCP clients to reach.
        protocol: STREAMABLE
        instructions: >
          Read-only tools over the docman document management system: ask natural-language
          questions answered via RAG (askQuestion), search indexed document chunks by exact
          metadata (searchByMetadata) or by free-text plus optional metadata filters
          (hybridSearch), and fetch a specific document's metadata, revision history, or a
          presigned download link by id.