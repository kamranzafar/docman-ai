spring:
  ai:
    model:
      chat: openai
      embedding: openai
    vectorstore:
      opensearch:
        # OpenAI's text-embedding-3-small produces 1536-dim vectors, vs. 768 for
        # Ollama's nomic-embed-text - a different index is required since OpenSearch
        # won't let you change an existing field's knn_vector dimension in place.
        # Point this at a fresh index (or reindex all documents into it) before
        # running with this profile.
        index-name: docman-vector-index-openai
        dimensions: 1536
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-5.4-mini
          temperature: 1
      embedding:
        options:
          model: text-embedding-3-small
